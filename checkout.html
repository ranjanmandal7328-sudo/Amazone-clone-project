<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>
    <form id="shippingForm">

        <div class="box">
            <div class="input">
                <h1>Shipping Address</h1>
                <input type="text" id="checkout" placeholder="Full Name"> <br>
                <input type="number" placeholder="Mobile Number"> <br>
                <textarea name="Address" placeholder="Full Address" id="CTC"> </textarea> <br>
                <input type="text" placeholder="State"> <br>
                <input type="text" placeholder="City"> <br>
                <input type="pincode" placeholder="Pincode">

            </div>
            <hr>
            <div class="box1">
                <h1>Payment Method</h1>
                <input type="radio" id="Cash on Delivery" name="payment">
                <label for="Cash on Delivery"> Cash on Delivery</label><br>
                <input type="radio" id="UPI payment" name="payment">
                <label for="UPI payment">UPI payment</label> <br>
                <input type="radio" id="credit/debit card" name="payment">
                <label for="credit/debit card">Credit/Debit card</label><br>

            </div>
            <div id="btn">
                   <a href="paymentsucc.html"><button>Submit</button></a>
                
            
                    
                  
            </div>
        </div>

    </form>
</body>

</html>
